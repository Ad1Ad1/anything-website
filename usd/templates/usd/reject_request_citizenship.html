{% extends "blogs/base.html" %}
{% load django_bootstrap5 %}
{% block page_header %}
<h4 class="fw-light"><a class="text-decoration-none" href="{% url "blogs:index" %}">Site</a>/<a class="text-decoration-none" href="{% url "usd:view_usd_page" %}">Community</a>/<a class="text-decoration-none" href="{% url "usd:view_moderator_ucr" %}">Membership Moderation</a>/{{ req.id }}/reject/</h4>
<h3>Rejecting Community Membership request</h3>
{% endblock page_header %}
{% block content %}
<form action="{% url "usd:reject_citizenship_request" req.id %}" method='post' class="form">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button name="submit" class="btn btn-danger">Reject</button>
</form>
{% endblock content %}
